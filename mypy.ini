# Settings for `.venv/bin/mypy pipeline/fairscout`.
# They are here and not in pipeline/pyproject.toml because mypy reads its settings from the
# folder it is started in (or a parent of it), never from the folder of the code it checks.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True

# scikit-learn ships no type stubs
[mypy-sklearn.*]
ignore_missing_imports = True
